name: Node.js CI (Campus Resource Management Testing)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    # Tells GitHub Actions to run all commands inside the BackEnd directory
    defaults:
      run:
        working-directory: ./BackEnd

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        # FIX: Point this to the exact subfolder location where package-lock.json lives
        cache-dependency-path: './BackEnd/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Integration Tests
      run: npm test
      env:
        MONGO_URI: mongodb://localhost:27017/campus_test_db
        JWT_SECRET: supersecretgithubactionsvalidationkey123
        NODE_ENV: test