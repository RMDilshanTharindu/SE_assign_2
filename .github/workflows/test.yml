name: Node.js CI (Campus Resource Management Testing)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    defaults:
      run:
        working-directory: ./BackEnd

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './BackEnd/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Integration Tests
      # Added --forceExit to prevent asynchronous open handles from blocking Node 18 runners
      run: npm test -- --forceExit
      env:
        # FIX: Changed 'localhost' to the explicit IPv4 '127.0.0.1' address
        MONGO_URI: mongodb://127.0.0.1:27017/campus_test_db
        JWT_SECRET: supersecretgithubactionsvalidationkey123
        NODE_ENV: test